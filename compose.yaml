name: web-tune-handson
services:
  db:
    image: mysql:8.4.13@sha256:a81d043930e51745522bd5c430961cf8286f0a23f0a9a2a6e0108f7ea71b0902
    environment:
      MYSQL_DATABASE: ramen
      MYSQL_USER: ramen
      MYSQL_PASSWORD: ramen
      MYSQL_ROOT_PASSWORD: local-root
    volumes:
      - db-data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD=ramen mysql -h 127.0.0.1 -u ramen ramen -Nse "SELECT COUNT(*) FROM seed_ready" | grep -q 1']
      interval: 3s
      timeout: 5s
      retries: 100
  app:
    build: .
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: ramen
      DB_USERNAME: ramen
      DB_PASSWORD: ramen
      CHECK_BASE_URL: http://127.0.0.1:3000
      CACHE_STORE: file
    ports: ["127.0.0.1:8080:3000"]
    volumes:
      - ./app/app:/app/app
      - ./app/routes:/app/routes
      - ./app/public:/app/public
      - ./app/bootstrap:/app/bootstrap
      - ./app/config:/app/config
      - ./tests:/work/tests:ro
      - ./scripts:/work/scripts:ro
      - ./results:/results
    depends_on:
      db:
        condition: service_healthy
volumes:
  db-data:
